# Builds the db and postgraphile images for amd64 and arm64 and publishes them on the GitHub
# Container Registry, under the tags on the image: lines of docker-compose.yml and
# compose/final.yml. A tag is published once and never replaced: when a tag exists but was
# built from other content, the run fails and names it (see compose/README.md).
name: Images

on:
  push:
    # Every branch: the first job checks the tags. Only main and manual runs publish.
    branches: ['**']
    paths:
      - docker-compose.yml
      - compose/final.yml
      - compose/db/**
      - compose/postgraphile/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions: {}

# One run at a time, so that two runs never publish the same tag.
concurrency:
  group: images
  cancel-in-progress: false

env:
  REPOSITORY: ghcr.io/lcalisto/workshop-spatial-graphql
  # Index annotation that records what an image was built from: for db:initial-N the git blob
  # hashes of compose/db/Dockerfile and compose/db/init/00-initial-db.sql.gz (the only files its
  # stage uses), for db:final-N the git tree of compose/db, for postgraphile:N the git tree of
  # compose/postgraphile.
  BUILD_KEY: io.github.lcalisto.workshop-spatial-graphql.build-key

jobs:
  plan:
    name: Check the tags
    if: github.repository == 'lcalisto/workshop-spatial-graphql'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      any: ${{ steps.check.outputs.any }}
      db_initial: ${{ steps.check.outputs.db_initial }}
      db_final: ${{ steps.check.outputs.db_final }}
      postgraphile: ${{ steps.check.outputs.postgraphile }}
      db_initial_key: ${{ steps.check.outputs.db_initial_key }}
      db_final_key: ${{ steps.check.outputs.db_final_key }}
      postgraphile_key: ${{ steps.check.outputs.postgraphile_key }}
      publish_db_initial: ${{ steps.check.outputs.publish_db_initial }}
      publish_db_final: ${{ steps.check.outputs.publish_db_final }}
      publish_postgraphile: ${{ steps.check.outputs.publish_postgraphile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare the tags with the registry
        id: check
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          image() { docker compose -f "$1" config --format json | jq -r --arg s "$2" '.services[$s].image // ""'; }
          build() {
            docker compose -f "$1" config --format json | jq -r --arg s "$2" \
              '.services[$s].build | [(.context | sub(".*/"; "")), (.target // "none"), (.dockerfile // "Dockerfile"), ((.args // {}) | length | tostring)] | join(" ")'
          }

          db_initial=$(image docker-compose.yml db)
          db_final=$(image compose/final.yml db)
          postgraphile=$(image docker-compose.yml postgraphile)
          postgraphile_final=$(image compose/final.yml postgraphile)
          if [[ "$db_initial $db_final $postgraphile $postgraphile_final" != *ghcr.io/* ]]; then
            echo "::notice::The compose files name no published images, so there is nothing to publish."
            echo "any=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$db_initial" in "$REPOSITORY/db:initial-"?*) ;; *) fail "docker-compose.yml: db needs image: $REPOSITORY/db:initial-<number>" ;; esac
          case "$db_final" in "$REPOSITORY/db:final-"?*) ;; *) fail "compose/final.yml: db needs image: $REPOSITORY/db:final-<number>" ;; esac
          case "$postgraphile" in "$REPOSITORY/postgraphile:"?*) ;; *) fail "docker-compose.yml: postgraphile needs image: $REPOSITORY/postgraphile:<number>" ;; esac
          [ "$postgraphile_final" = "$postgraphile" ] || fail "postgraphile needs the same image: line in docker-compose.yml and compose/final.yml"
          # The build settings must be the ones this workflow builds with.
          [ "$(build docker-compose.yml db)" = "db initial Dockerfile 0" ] || fail "docker-compose.yml: db must build compose/db with target initial, the default Dockerfile and no args, as this workflow does."
          [ "$(build compose/final.yml db)" = "db final Dockerfile 0" ] || fail "compose/final.yml: db must build compose/db with target final, the default Dockerfile and no args, as this workflow does."
          [ "$(build docker-compose.yml postgraphile)" = "postgraphile none Dockerfile 0" ] || fail "docker-compose.yml: postgraphile must build compose/postgraphile with no target, the default Dockerfile and no args, as this workflow does."
          [ "$(build compose/final.yml postgraphile)" = "postgraphile none Dockerfile 0" ] || fail "compose/final.yml: postgraphile must build compose/postgraphile with no target, the default Dockerfile and no args, as this workflow does."

          # If the initial stage of compose/db/Dockerfile ever copies more files, add them here.
          db_initial_key="$(git rev-parse HEAD:compose/db/Dockerfile)-$(git rev-parse HEAD:compose/db/init/00-initial-db.sql.gz)"
          db_final_key=$(git rev-parse HEAD:compose/db)
          postgraphile_key=$(git rev-parse HEAD:compose/postgraphile)
          any=false
          check() {
            local name=$1 ref=$2 key=$3 what=$4 published digest
            if docker buildx imagetools inspect --raw "$ref" > index.json 2> error.txt; then
              published=$(jq -r --arg k "$BUILD_KEY" '.annotations[$k] // ""' index.json)
              [ "$published" = "$key" ] || fail "$ref is already published, built from other content of $what. Raise the number at the end of this tag in the compose files (see compose/README.md)."
              # Both platform images must still exist: GHCR lists them as untagged versions, which cleanup tools delete.
              while read -r digest; do
                docker buildx imagetools inspect --raw "${ref%:*}@$digest" > /dev/null 2>&1 \
                  || fail "$ref is published, but its platform image $digest is missing. Raise the number at the end of this tag in the compose files."
              done < <(jq -r '.manifests[].digest' index.json)
              echo "$ref is published, built from this content of $what."
              echo "publish_$name=false" >> "$GITHUB_OUTPUT"
            elif grep -qF -- "$ref: not found" error.txt; then
              echo "$ref is not published yet."
              echo "publish_$name=true" >> "$GITHUB_OUTPUT"
              any=true
            else
              cat error.txt
              fail "Could not check $ref, so nothing was published."
            fi
          }
          check db_initial "$db_initial" "$db_initial_key" "the Dockerfile or the dump in compose/db"
          check db_final "$db_final" "$db_final_key" compose/db
          check postgraphile "$postgraphile" "$postgraphile_key" compose/postgraphile
          {
            echo "any=$any"
            echo "db_initial=$db_initial"
            echo "db_final=$db_final"
            echo "postgraphile=$postgraphile"
            echo "db_initial_key=$db_initial_key"
            echo "db_final_key=$db_final_key"
            echo "postgraphile_key=$postgraphile_key"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.any == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # Each platform sets its own three outputs; GitHub combines them across the matrix.
    outputs:
      db_initial_amd64: ${{ steps.digests.outputs.db_initial_amd64 }}
      db_initial_arm64: ${{ steps.digests.outputs.db_initial_arm64 }}
      db_final_amd64: ${{ steps.digests.outputs.db_final_amd64 }}
      db_final_arm64: ${{ steps.digests.outputs.db_final_arm64 }}
      postgraphile_amd64: ${{ steps.digests.outputs.postgraphile_amd64 }}
      postgraphile_arm64: ${{ steps.digests.outputs.postgraphile_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Native builds, pushed by digest only: the publish job tags both platforms at once.
      - name: Database at the start of the workshop
        id: db_initial
        if: needs.plan.outputs.publish_db_initial == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compose/db
          target: initial
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }}/db,push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true
      - name: Database at the end of the workshop
        id: db_final
        if: needs.plan.outputs.publish_db_final == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compose/db
          target: final
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }}/db,push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true
      - name: PostGraphile
        id: postgraphile
        if: needs.plan.outputs.publish_postgraphile == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: compose/postgraphile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.REPOSITORY }}/postgraphile,push-by-digest=true,name-canonical=true,oci-mediatypes=true,push=true
      - name: Record the digests
        id: digests
        env:
          ARCH: ${{ matrix.arch }}
          DB_INITIAL: ${{ steps.db_initial.outputs.digest }}
          DB_FINAL: ${{ steps.db_final.outputs.digest }}
          POSTGRAPHILE: ${{ steps.postgraphile.outputs.digest }}
        run: |
          {
            echo "db_initial_${ARCH}=${DB_INITIAL}"
            echo "db_final_${ARCH}=${DB_FINAL}"
            echo "postgraphile_${ARCH}=${POSTGRAPHILE}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the tags
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag both platforms of each new image
        env:
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
          DB_DESCRIPTION: "PostgreSQL with PostGIS and the workshop database already restored. Tags initial-N hold the start of the workshop and tags final-N the end of section 8."
          POSTGRAPHILE_DESCRIPTION: "PostGraphile 4 with the workshop plugins at the versions of compose/postgraphile/package-lock.json."
          PUBLISH_DB_INITIAL: ${{ needs.plan.outputs.publish_db_initial }}
          PUBLISH_DB_FINAL: ${{ needs.plan.outputs.publish_db_final }}
          PUBLISH_POSTGRAPHILE: ${{ needs.plan.outputs.publish_postgraphile }}
          DB_INITIAL: ${{ needs.plan.outputs.db_initial }}
          DB_FINAL: ${{ needs.plan.outputs.db_final }}
          POSTGRAPHILE: ${{ needs.plan.outputs.postgraphile }}
          DB_INITIAL_KEY: ${{ needs.plan.outputs.db_initial_key }}
          DB_FINAL_KEY: ${{ needs.plan.outputs.db_final_key }}
          POSTGRAPHILE_KEY: ${{ needs.plan.outputs.postgraphile_key }}
          DB_INITIAL_AMD64: ${{ needs.build.outputs.db_initial_amd64 }}
          DB_INITIAL_ARM64: ${{ needs.build.outputs.db_initial_arm64 }}
          DB_FINAL_AMD64: ${{ needs.build.outputs.db_final_amd64 }}
          DB_FINAL_ARM64: ${{ needs.build.outputs.db_final_arm64 }}
          POSTGRAPHILE_AMD64: ${{ needs.build.outputs.postgraphile_amd64 }}
          POSTGRAPHILE_ARM64: ${{ needs.build.outputs.postgraphile_arm64 }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # 0 when the tag exists with exactly the two digests of this run (an earlier attempt of
          # this run created it), 1 when it does not exist; any other existing tag stops the run.
          exists() {
            local ref=$1 amd64=$2 arm64=$3
            if docker buildx imagetools inspect --raw "$ref" > existing.json 2> error.txt; then
              jq -e --arg a "$amd64" --arg b "$arm64" '[.manifests[].digest] | sort == ([$a, $b] | sort)' existing.json > /dev/null \
                || fail "$ref exists already, with other content, and was left as it is."
              return 0
            fi
            if grep -qF -- "$ref: not found" error.txt; then return 1; fi
            cat error.txt
            fail "Could not check $ref."
          }
          # First pass "check": every tag is checked and dry-run before any tag is created.
          # Second pass "create": the tags are created.
          publish() {
            local mode=$1 ref=$2 key=$3 amd64=$4 arm64=$5 description=$6
            local name=${ref%:*}
            if [ -z "$amd64" ] || [ -z "$arm64" ]; then fail "A platform image of $ref is missing."; fi
            local args=(--tag "$ref"
              --annotation "index:org.opencontainers.image.source=$SOURCE"
              --annotation "index:org.opencontainers.image.revision=$REVISION"
              --annotation "index:org.opencontainers.image.description=$description"
              --annotation "index:$BUILD_KEY=$key"
              "$name@$amd64" "$name@$arm64")
            if [ "$mode" = check ]; then
              if ! exists "$ref" "$amd64" "$arm64"; then
                docker buildx imagetools create --dry-run "${args[@]}" > index.json
                jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' index.json > /dev/null \
                  || fail "$ref would not hold exactly linux/amd64 and linux/arm64."
              fi
            elif exists "$ref" "$amd64" "$arm64"; then
              echo "$ref was already published by an earlier attempt of this run."
            else
              docker buildx imagetools create "${args[@]}"
              echo "::notice::Published $ref"
            fi
          }
          for mode in check create; do
            if [ "$PUBLISH_DB_INITIAL" = true ]; then publish "$mode" "$DB_INITIAL" "$DB_INITIAL_KEY" "$DB_INITIAL_AMD64" "$DB_INITIAL_ARM64" "$DB_DESCRIPTION"; fi
            if [ "$PUBLISH_DB_FINAL" = true ]; then publish "$mode" "$DB_FINAL" "$DB_FINAL_KEY" "$DB_FINAL_AMD64" "$DB_FINAL_ARM64" "$DB_DESCRIPTION"; fi
            if [ "$PUBLISH_POSTGRAPHILE" = true ]; then publish "$mode" "$POSTGRAPHILE" "$POSTGRAPHILE_KEY" "$POSTGRAPHILE_AMD64" "$POSTGRAPHILE_ARM64" "$POSTGRAPHILE_DESCRIPTION"; fi
          done

  access:
    name: Check anonymous access
    needs: [plan, build, publish]
    # Also when nothing had to be published, so that every push to main checks that attendees
    # can pull the tags without logging in. A new package starts private.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.db_initial != '' && needs.build.result != 'failure' && needs.publish.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      REFS: ${{ needs.plan.outputs.db_initial }} ${{ needs.plan.outputs.db_final }} ${{ needs.plan.outputs.postgraphile }}
    steps:
      - name: Pull the index of each tag without logging in, as attendees do
        run: |
          set -euo pipefail
          accept="application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"
          read -ra refs <<< "$REFS"
          private=
          for ref in "${refs[@]}"; do
            path=${ref#ghcr.io/}
            token=$(curl -fsS "https://ghcr.io/token?scope=repository:${path%:*}:pull" | jq -r '.token // empty' || true)
            if [ -n "$token" ] && curl -fsS -o /dev/null -H "Authorization: Bearer $token" -H "Accept: $accept" "https://ghcr.io/v2/${path%:*}/manifests/${path##*:}"; then
              echo "$ref can be pulled without logging in."
            else
              private="$private $ref"
            fi
          done
          if [ -n "$private" ]; then
            message="Cannot be pulled without logging in. Make the package public (Package settings, Danger Zone, Change visibility):$private"
            if [ "$GITHUB_REF" = refs/heads/main ]; then echo "::error::$message"; exit 1; fi
            echo "::warning::$message"
          fi
