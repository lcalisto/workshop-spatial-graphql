name: pgv5c
services:
  db:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: workshop_graphql
      POSTGRES_PASSWORD: test
    volumes:
      # Reuses the workshop's own dump; no copy needed.
      - ../../../compose/db/init/00-initial-db.sql.gz:/docker-entrypoint-initdb.d/00-initial-db.sql.gz:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d workshop_graphql -tAc 'SELECT count(*) FROM app_public.municipality;' | grep -qE '^[1-9]'"]
      interval: 5s
      timeout: 5s
      retries: 90
      start_period: 20s
  graphql:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:test@db/workshop_graphql
    ports:
      - "5560:5000"
    depends_on:
      db:
        condition: service_healthy
